name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Un deploy de Pages no debe cancelarse a medias: si se interrumpe,
  # el sitio se queda con la versión anterior aunque el push sea correcto.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      # El sitio vive en https://usuario.github.io/Proyecto_minicurso_calculoII/.
      # En local se sirve desde "/", por eso el base href se fija aquí y no
      # depende de lo que esté commiteado en wwwroot/index.html.
      - name: Configurar base href para GitHub Pages
        run: |
          sed -i -E 's|<base href="[^"]*" />|<base href="/Proyecto_minicurso_calculoII/" />|' publish/wwwroot/index.html

      # Sello de versión: permite comprobar con "Ver código fuente" qué commit
      # está realmente publicado (y distinguirlo de la caché del navegador).
      - name: Añadir sello de versión
        run: |
          sed -i "s|</head>|<meta name=\"commit\" content=\"${GITHUB_SHA}\" />\n</head>|" publish/wwwroot/index.html

      - name: Add 404.html for SPA fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
