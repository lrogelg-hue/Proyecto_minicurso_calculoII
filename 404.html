<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minicurso de Cálculo II — Sólidos en Revolución. Universidad Mariano Gálvez de Guatemala." />
    <meta name="theme-color" content="#0c1425" />
    <title>Minicurso Cálculo II · Sólidos en Revolución — UMG</title>
    <base href="/Proyecto_minicurso_calculoII/" />
    <link rel="preload" id="webassembly" />

    <!-- Tipografía: Source Serif 4 (titulares, dialoga con la matemática)
         e Inter (interfaz y lectura de pantalla) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/minicurso.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MinicursoCalculoII.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- Configuración de MathJax para renderizar fórmulas LaTeX -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    // Avisa a Blazor que MathJax terminó de cargar
                    if (window.dotNetHelper) {
                        window.dotNetHelper.invokeMethodAsync('OnMathJaxReady');
                    }
                }
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" role="img" aria-label="Cargando la aplicación">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text" role="status"></div>
    </div>

    <div id="blazor-error-ui">
        Se produjo un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/mathjax-interop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
